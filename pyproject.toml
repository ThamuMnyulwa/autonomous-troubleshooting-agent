[project]
name = "pipeline-resolver"
version = "0.1.0"
description = "Autonomous pipeline troubleshooting agent - Azure / Databricks"
requires-python = ">=3.12"
dependencies = [
    # Orchestration
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=4.1.3",
    "langchain-mcp-adapters>=0.2.2",
    # MCP
    "mcp>=1.9.0",
    "databricks-mcp>=0.9.0",
    "databricks-sdk>=0.30.0",
    # Database (Neon)
    "psycopg[pool]>=3.2.0",
    # Runtime API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Azure runtime
    "azure-identity>=1.19.0",
    "azure-servicebus>=7.14.2",
    "aiohttp>=3.9.0",
    # Azure DevOps
    "azure-devops>=7.1.0b4,<7.2.0",
    "msrest>=0.7.1",
    # PII redaction (Phase 2 - install when ready)
    # "presidio-analyzer>=2.2.0",
    # "presidio-anonymizer>=2.2.0",
    # Utilities
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.15.9",
    "loguru>=0.7.3",
    "mlflow>=3.10.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.32.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--strict-markers"]
markers = [
    "unit: fast isolated tests with mocked dependencies",
    "integration: multi-component tests that exercise real local integrations",
]
testpaths = ["tests/unit", "tests/integration"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
